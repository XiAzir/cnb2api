name: test

on:
  push:
    branches: [main, feat/reliable-thinking-streams]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax check
        run: |
          for file in src/*.mjs test/*.mjs bin/*.mjs; do node --check "$file"; done
      - run: node --test
      - name: deploy scripts syntax
        run: |
          python3 -m py_compile deploy/cnb-register.py
          bash -n deploy/start.sh
